version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atm-cleaning-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped

  flutter-app:
    image: cirrusci/flutter:latest
    container_name: atm-cleaning-flutter
    working_dir: /app
    volumes:
      - ./atm_machine__app:/app
    command: ["flutter", "build", "web"]
    restart: unless-stopped
